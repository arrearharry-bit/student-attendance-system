<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:#161b22; border:1px solid #30363d; border-radius:16px; padding:40px; width:100%; max-width:480px; }
        .back { color:#7c6ff7; text-decoration:none; font-size:0.9rem; display:inline-block; margin-bottom:20px; }
        h1 { font-size:1.5rem; margin-bottom:6px; }
        .subtitle { color:#8b949e; font-size:0.9rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        label { display:block; color:#8b949e; font-size:0.85rem; margin-bottom:6px; }
        input[type=text], input[type=email], input[type=password], select {
            width:100%; padding:11px 14px; background:#0d1117; border:1px solid #30363d;
            border-radius:8px; color:#e6edf3; font-size:0.95rem; font-family:inherit; transition:border-color 0.2s;
        }
        input:focus, select:focus { outline:none; border-color:#7c6ff7; }
        .btn { width:100%; padding:13px; background:linear-gradient(135deg,#7c6ff7,#5b52e0); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; transition:all 0.3s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,111,247,0.4); }
        .divider { border:none; border-top:1px solid #30363d; margin:20px 0; }
        small { color:#8b949e; font-size:0.8rem; }
    </style>
</head>
<body>
<div class="card">
    <a href="/admin/student/{{ student['id'] }}" class="back">← Back to Profile</a>
    <h1>Edit Student</h1>
    <p class="subtitle">Updating: <strong>{{ student['username'] }}</strong></p>
    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" value="{{ student['name'] or '' }}" placeholder="Full name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ student['email'] or '' }}" placeholder="student@example.com">
        </div>
        <div class="form-group">
            <label>Account Status</label>
            <select name="status">
                <option value="active" {% if student['status']=='active' %}selected{% endif %}>✅ Active</option>
                <option value="inactive" {% if student['status']=='inactive' %}selected{% endif %}>❌ Inactive</option>
                <option value="suspended" {% if student['status']=='suspended' %}selected{% endif %}>⚠️ Suspended</option>
            </select>
        </div>
        <hr class="divider">
        <div class="form-group">
            <label>New Password <small>(leave blank to keep current)</small></label>
            <input type="password" name="new_password" placeholder="Enter new password…">
        </div>
        <button type="submit" class="btn">Save Changes</button>
    </form>
</div>
</body>
</html>
