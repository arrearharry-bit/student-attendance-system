<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Student | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:#161b22; border:1px solid #30363d; border-radius:16px; padding:40px; width:100%; max-width:480px; }
        .back { color:#7c6ff7; text-decoration:none; font-size:0.9rem; display:inline-block; margin-bottom:20px; }
        h1 { font-size:1.5rem; margin-bottom:6px; }
        .subtitle { color:#8b949e; font-size:0.9rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        label { display:block; color:#8b949e; font-size:0.85rem; margin-bottom:6px; }
        input[type=text], input[type=email], input[type=password] {
            width:100%; padding:11px 14px; background:#0d1117; border:1px solid #30363d;
            border-radius:8px; color:#e6edf3; font-size:0.95rem; font-family:inherit; transition:border-color 0.2s;
        }
        input:focus { outline:none; border-color:#7c6ff7; }
        .btn { width:100%; padding:13px; background:linear-gradient(135deg,#7c6ff7,#5b52e0); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; transition:all 0.3s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,111,247,0.4); }
        .error { background:rgba(255,80,80,0.15); border:1px solid rgba(255,80,80,0.4); color:#ff6b6b; padding:10px 14px; border-radius:8px; margin-bottom:18px; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <a href="/admin/students" class="back">← Back to Students</a>
    <h1>Register New Student</h1>
    <p class="subtitle">Create a student account for the attendance system.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="e.g. Amlan Mohanty" required>
        </div>
        <div class="form-group">
            <label>Username <small style="color:#8b949e">(used for login)</small></label>
            <input type="text" name="username" placeholder="e.g. amlan" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="student@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Set a password" required>
        </div>
        <button type="submit" class="btn">Register Student</button>
    </form>
</div>
</body>
</html>
