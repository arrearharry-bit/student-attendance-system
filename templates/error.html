{% extends "base.html" %}
{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-secondary shadow-lg py-5">
                <h1 class="display-1 text-danger mb-4">{{ code }}</h1>
                <h2 class="h4 text-light mb-4">{{ message }}</h2>
                <p class="text-secondary mb-5">
                    Sorry, something went wrong or the page you are looking for doesn't exist.
                </p>
                <a href="{{ url_for('home') }}" class="btn btn-outline-primary btn-lg px-5">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
