<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Link — Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(88, 166, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(31, 111, 235, 0.08) 0%, transparent 40%);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 48px;
            width: 100%; max-width: 420px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(40px); } to { opacity:1; transform: translateY(0); } }
        
        .logo { 
            text-align: center; font-size: 3.5rem; margin-bottom: 20px; 
            filter: drop-shadow(0 0 15px rgba(88,166,255,0.3));
        }
        h1 { text-align: center; color: #fff; font-size: 1.85rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.95rem; margin-bottom: 40px; font-weight: 500; }
        
        .form-group { margin-bottom: 24px; }
        label { display: block; color: rgba(255,255,255,0.6); font-size: 0.75rem; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type=text], input[type=password] {
            width: 100%; padding: 14px 18px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus { outline: none; border-color: var(--accent); background: rgba(88, 166, 255, 0.05); box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.1); }
        input::placeholder { color: rgba(255,255,255,0.2); }
        
        .btn-submit {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s; margin-top: 12px;
            box-shadow: 0 8px 20px rgba(31, 111, 235, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(31, 111, 235, 0.5); }
        
        .error { 
            background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.2);
            color: #ff7b72; padding: 12px 16px; border-radius: 10px; margin-bottom: 24px;
            font-size: 0.9rem; font-weight: 500; text-align: center;
        }
        .hint { text-align: center; color: rgba(255,255,255,0.25); font-size: 0.8rem; margin-top: 24px; font-weight: 600; }
        
        /* Floating background elements */
        .orb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🧬</div>
        <h1>Neural Link</h1>
        <p class="subtitle">Secure administrative access</p>
        
        {% if error %}
        <div class="error"><i class="fa fa-circle-exclamation me-2"></i>{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Entity ID</label>
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Access Key</label>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Initialize Auth</button>
        </form>
        
        <div class="hint">Role: Admin / Student</div>
    </div>
</body>
</html>
