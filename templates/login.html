<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%; max-width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        .logo { text-align: center; font-size: 3rem; margin-bottom: 10px; }
        h1 { text-align: center; color: #fff; font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 6px; }
        input[type=text], input[type=password] {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: #fff; font-size: 1rem;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #7c6ff7; background: rgba(124,111,247,0.15); }
        input::placeholder { color: rgba(255,255,255,0.3); }
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #7c6ff7, #5b52e0);
            color: #fff; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,111,247,0.5); }
        .error { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.4);
                 color: #ff6b6b; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px;
                 font-size: 0.9rem; }
        .hint { text-align: center; color: rgba(255,255,255,0.35); font-size: 0.8rem; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🎓</div>
        <h1>Attendance System</h1>
        <p class="subtitle">Sign in to your account</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="hint">Admin: admin / admin123</p>
    </div>
</body>
</html>
